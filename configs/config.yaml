data:
  raw_path: "data/raw/dataset.csv"
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"
  target: "price"
  features:
    - "area_sqft"
    - "bedrooms"
    - "bathrooms"
    - "age_years"
    - "distance_km"

training:
  test_size: 0.2
  random_state: 42

model:
  type: "random_forest"
  n_estimators: 100
  max_depth: 5
  random_state: 42
  pipeline_output_path: "models/house_price_pipeline.joblib"

reports:
  metrics_path: "reports/metrics.json"
  predictions_path: "reports/sample_predictions.json"
  plot_path: "reports/figures/actual_vs_predicted.png"
