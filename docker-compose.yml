version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-inference-api:1.0
    container_name: ml-api-service
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/house_price_pipeline.joblib
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --default-artifact-root /mlflow-data/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow-data:/mlflow-data
    restart: unless-stopped

volumes:
  mlflow-data:
    driver: local
